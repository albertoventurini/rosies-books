quarkus.oidc.enabled=false
rosies-books.oidc.enabled=false
rosies-books.release-version=@release.version@

# Google OpenID Connect is enabled only in production and the explicit local-oidc profile.
# Runtime values belong in a deployment secret manager or an untracked local environment file.
%prod.quarkus.oidc.enabled=true
%prod.rosies-books.oidc.enabled=true
%prod.quarkus.oidc.application-type=web-app
%prod.quarkus.oidc.auth-server-url=https://accounts.google.com
%prod.quarkus.oidc.authentication.redirect-path=/oidc/callback
%prod.quarkus.oidc.authentication.force-redirect-https-scheme=true
%prod.quarkus.oidc.authentication.scopes=openid,profile,email
%prod.quarkus.oidc.client-id=${ROSIES_BOOKS_GOOGLE_OIDC_CLIENT_ID:}
%prod.quarkus.oidc.credentials.secret=${ROSIES_BOOKS_GOOGLE_OIDC_CLIENT_SECRET:}
%prod.quarkus.oidc.authentication.pkce-required=true
%prod.quarkus.oidc.authentication.state-secret=${ROSIES_BOOKS_GOOGLE_OIDC_STATE_SECRET:}
%prod.rosies-books.oidc.allowed-emails=${ROSIES_BOOKS_GOOGLE_OIDC_ALLOWED_EMAILS:}
%prod.quarkus.http.auth.permission.private.paths=/*
%prod.quarkus.http.auth.permission.private.policy=authenticated
%prod.quarkus.http.auth.permission.public.paths=/q/health/*,/assets/*,/dev/users,/dev/users/*
%prod.quarkus.http.auth.permission.public.policy=permit

# Uses a separate Google OAuth Web application client from production.
%local-oidc.quarkus.oidc.enabled=true
%local-oidc.rosies-books.oidc.enabled=true
%local-oidc.quarkus.oidc.application-type=web-app
%local-oidc.quarkus.oidc.auth-server-url=https://accounts.google.com
%local-oidc.quarkus.oidc.authentication.redirect-path=/oidc/callback
%local-oidc.quarkus.oidc.authentication.scopes=openid,profile,email
%local-oidc.quarkus.oidc.client-id=${ROSIES_BOOKS_GOOGLE_OIDC_LOCAL_CLIENT_ID:}
%local-oidc.quarkus.oidc.credentials.secret=${ROSIES_BOOKS_GOOGLE_OIDC_LOCAL_CLIENT_SECRET:}
%local-oidc.quarkus.oidc.authentication.pkce-required=true
%local-oidc.quarkus.oidc.authentication.state-secret=${ROSIES_BOOKS_GOOGLE_OIDC_LOCAL_STATE_SECRET:}
%local-oidc.rosies-books.oidc.allowed-emails=${ROSIES_BOOKS_GOOGLE_OIDC_LOCAL_ALLOWED_EMAILS:}
%local-oidc.quarkus.datasource.devservices.enabled=false
%local-oidc.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:${ROSIES_BOOKS_POSTGRES_PORT:5432}/rosies_books
%local-oidc.quarkus.datasource.username=rosies
%local-oidc.quarkus.datasource.password=rosies-local
%local-oidc.quarkus.http.auth.permission.private.paths=/*
%local-oidc.quarkus.http.auth.permission.private.policy=authenticated
%local-oidc.quarkus.http.auth.permission.public.paths=/q/health/*,/assets/*
%local-oidc.quarkus.http.auth.permission.public.policy=permit

quarkus.datasource.db-kind=postgresql
quarkus.datasource.health.enabled=true

quarkus.flyway.locations=db/migration
quarkus.flyway.validate-on-migrate=true
quarkus.flyway.migrate-at-start=true
quarkus.flyway.clean-disabled=true
quarkus.flyway.repair-at-start=false

rosies-books.default-zone=Africa/Johannesburg
rosies-books.review-token.secret=development-review-token-secret-change-before-production
%prod.rosies-books.review-token.secret=${ROSIES_BOOKS_REVIEW_TOKEN_SECRET:}

rosies-books.open-library.base-url=https://openlibrary.org
rosies-books.open-library.connect-timeout=2S
rosies-books.open-library.request-timeout=5S
rosies-books.open-library.requests-per-second=3
rosies-books.open-library.log-full-exception-details=false
%dev.rosies-books.open-library.log-full-exception-details=true
%prod.rosies-books.open-library.operator-contact=${ROSIES_BOOKS_OPEN_LIBRARY_OPERATOR_CONTACT:}

rosies-books.google-books.base-url=https://www.googleapis.com/books/v1/
rosies-books.google-books.api-key=${ROSIES_BOOKS_GOOGLE_BOOKS_API_KEY:}
rosies-books.google-books.connect-timeout=2S
rosies-books.google-books.request-timeout=5S
rosies-books.google-books.log-full-exception-details=false
%dev.rosies-books.google-books.log-full-exception-details=true
%test.rosies-books.google-books.api-key=test-google-books-api-key

%prod.quarkus.datasource.jdbc.url=${ROSIES_BOOKS_DATABASE_URL:}
%prod.quarkus.datasource.username=${ROSIES_BOOKS_DATABASE_USERNAME:}
%prod.quarkus.datasource.password=${ROSIES_BOOKS_DATABASE_PASSWORD:}

%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:${ROSIES_BOOKS_POSTGRES_PORT:5432}/rosies_books
%dev.quarkus.datasource.username=rosies
%dev.quarkus.datasource.password=rosies-local

# Script-only profile for image/database/readiness smoke verification. Do not use for deployments.
%container-smoke.quarkus.oidc.enabled=false
%container-smoke.rosies-books.oidc.enabled=false
%container-smoke.quarkus.oidc.auth-server-url=https://invalid.example
%container-smoke.quarkus.oidc.client-id=container-smoke-client-id
%container-smoke.quarkus.oidc.credentials.secret=container-smoke-client-secret
%container-smoke.quarkus.oidc.authentication.state-secret=container-smoke-state-secret
%container-smoke.quarkus.datasource.jdbc.url=${ROSIES_BOOKS_DATABASE_URL:}
%container-smoke.quarkus.datasource.username=${ROSIES_BOOKS_DATABASE_USERNAME:}
%container-smoke.quarkus.datasource.password=${ROSIES_BOOKS_DATABASE_PASSWORD:}
%container-smoke.rosies-books.review-token.secret=${ROSIES_BOOKS_REVIEW_TOKEN_SECRET:}
%container-smoke.rosies-books.open-library.operator-contact=${ROSIES_BOOKS_OPEN_LIBRARY_OPERATOR_CONTACT:}
%container-smoke.rosies-books.google-books.api-key=${ROSIES_BOOKS_GOOGLE_BOOKS_API_KEY:}

%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:18.4
%test.quarkus.datasource.devservices.reuse=false
