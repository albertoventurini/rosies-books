services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: rosies_books
      POSTGRES_USER: rosies
      POSTGRES_PASSWORD: rosies-local
    ports:
      - "${ROSIES_BOOKS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - rosies-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  rosies-postgres-data:
